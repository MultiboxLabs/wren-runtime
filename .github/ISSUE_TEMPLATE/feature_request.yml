name: Feature request
description: Wren Runtime can't do something your app needs.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search the open issues first. Your release's `docs/limitations.md` lists what Wren Runtime can't do yet.
  - type: textarea
    id: need
    attributes:
      label: What your app needs
      description: What you're building, and what Wren Runtime can't do for it.
    validations:
      required: true
  - type: textarea
    id: chromium
    attributes:
      label: How Chrome does it
      description: If Chrome or another Chromium browser already does this, say where to see it.
  - type: textarea
    id: workaround
    attributes:
      label: What you do now
      description: How you work around it today, if you can.
