name: Bug report
description: Wren Runtime does something wrong, or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search the open issues first, and check the known issues in your release's `docs/this-release.md`.
        Report a security vulnerability privately instead, as SECURITY.md describes.
  - type: input
    id: version
    attributes:
      label: Wren Runtime release
      description: The `wren` value in your app's `wren-app.json`, such as 0.5.0.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 27.2
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Swift
        - Rust
        - C
        - Another language, through the C API
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what Wren Runtime did, and what you expected it to do.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The smallest app or the fewest steps that show it. One of the sample browsers with a change is best.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash report or log
      description: For a crash, paste the report from Console, under Crash Reports. Remove anything private first.
      render: text
