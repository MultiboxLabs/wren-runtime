name: Bug report
description: Wren does something wrong, or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. Search the open issues first, and read the known issues in `docs/this-release.md` of your release.
        A security vulnerability goes in a private report, not here. SECURITY.md says how.
  - type: input
    id: version
    attributes:
      label: Wren release
      description: The `wren` value in your app's `wren-app.json`, such as 0.3.0.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Swift
        - Rust
        - C
        - Another language, through the C API
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what Wren did, and what you expected it to do.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The smallest app or steps that show it. A sample app with a change is best.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash report or log
      description: For a crash, the report from Console, under Crash Reports. Remove anything private first.
      render: text
